name: Kronos diário

on:
  schedule:
    - cron: "17 21 * * 1-5"   # 18:17 de Brasília, após o fecho, em dias úteis
  workflow_dispatch:           # botão "Run workflow" para rodar na hora

permissions:
  contents: write

concurrency:
  group: kronos
  cancel-in-progress: false

jobs:
  prever:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências (PyTorch CPU + Kronos)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install pandas numpy requests einops safetensors huggingface_hub tqdm
          git clone --depth 1 https://github.com/jrjrgilson-blip/kronos kronos_src

      - name: Cache do modelo
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-kronos-small-v1

      - name: Rodar Kronos na watchlist
        env:
          BRAPI_TOKEN: ${{ secrets.BRAPI_TOKEN }}
          KRONOS_DIR: kronos_src
        run: python kronos_job.py

      - name: Gravar resultados no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898279+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || (git commit -m "Kronos: previsões $(date -u +%F)" && git push)
